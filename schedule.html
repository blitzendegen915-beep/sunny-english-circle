<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 公開用(GitHub Pages)ビルド: 写真は顔をぼかした加工版。未承認の試作のため検索避けを付けている -->
<meta name="robots" content="noindex, nofollow">
<title>開催エリア・会場／開催日時 | Sunny English Circle</title>
<meta name="description" content="Sunny English Circleは川崎市の溝の口・高津・中原・武蔵新城エリアで開催。会場はParklet Cafeほか。開催日時は回ごとにご案内しています。">
<style>
  :root {
    --paper: #FBF7F0;
    --paper-alt: #F4EDE2;
    --ink: #4A4239;
    --ink-sub: #7A6F64;
    --clay: #B98C68;
    --sage: #93A389;
    --rule: #E5DCCD;
    --walnut: #6A5A4B;
    --header-height: 60px;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS PMincho", serif;
    --sans: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.95;
    letter-spacing: 0.03em;
    padding-top: var(--header-height);
  }

  img, svg, video {
    max-width: 100%;
    height: auto;
    display: block;
  }

  a {
    color: inherit;
  }

  h1, h2 {
    font-family: var(--serif);
    font-weight: 400;
  }

  .section-inner {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Header / Menu ---------- */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--header-height);
    background-color: var(--paper);
    border-bottom: 1px solid var(--rule);
    z-index: 1000;
    display: flex;
    align-items: center;
  }

  @supports ((backdrop-filter: blur(6px)) or (-webkit-backdrop-filter: blur(6px))) {
    .site-header {
      background-color: rgba(251, 247, 240, 0.82);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
  }

  .header-inner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
  }

  .menu-toggle {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background-color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    padding: 0;
  }

  .menu-toggle span {
    display: block;
    width: 20px;
    height: 1px;
    background-color: var(--ink);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .menu-toggle[aria-expanded="true"] span:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }

  .menu-toggle[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }

  .menu-toggle[aria-expanded="true"] span:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }

  .site-title {
    font-family: var(--sans);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .site-nav {
    position: fixed;
    top: var(--header-height);
    left: 12px;
    width: min(260px, calc(100% - 24px));
    background-color: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-8px);
    visibility: hidden;
    pointer-events: none;
    transition: max-height 0.25s ease, opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.25s;
    z-index: 999;
  }

  .site-nav.is-open {
    max-height: 480px;
    visibility: visible;
    pointer-events: auto;
    transition-delay: 0s;
    opacity: 1;
    transform: translateY(0);
  }

  .site-nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .site-nav li + li {
    margin-top: 2px;
    border-top: 1px solid var(--rule);
  }

  .site-nav a {
    display: flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 14px;
    text-decoration: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.88rem;
    letter-spacing: 0.08em;
  }

  .site-nav a:hover,
  .site-nav a:focus {
    color: var(--clay);
  }

  .site-nav a[aria-current="page"] {
    color: var(--clay);
    font-weight: 500;
  }

  /* ---------- Page header (no slideshow on inner pages) ---------- */
  .page-header {
    padding: 48px 0 8px;
  }

  @media (min-width: 768px) {
    .page-header {
      padding: 72px 0 8px;
    }
  }

  .page-header h1 {
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.08em;
  }

  /* ---------- Sections ---------- */
  section.page-section {
    padding: 64px 0;
  }

  @media (min-width: 768px) {
    section.page-section {
      padding: 96px 0;
    }
  }

  section.page-section.section-alt {
    background-color: var(--paper-alt);
  }

  .eyebrow {
    display: block;
    font-family: var(--sans);
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    color: var(--ink-sub);
    margin-bottom: 10px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  h2 {
    font-size: 1.3rem;
    color: var(--ink);
    margin: 0 0 32px;
    letter-spacing: 0.06em;
  }

  .section-body p {
    margin: 0 0 20px;
  }

  .section-body p:last-child {
    margin-bottom: 0;
  }

  .note {
    font-size: 0.85rem;
    color: var(--ink-sub);
    margin-top: 20px;
  }

  /* labeled rows for area/venue */
  .info-row {
    padding: 24px 0;
  }

  .info-row:first-child {
    padding-top: 0;
  }

  .info-row .label {
    display: block;
    font-family: var(--sans);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--ink-sub);
    margin-bottom: 8px;
  }

  .info-row .value {
    margin: 0;
  }

  /* in-content photo */
  .photo-single {
    margin: 32px 0 0;
    max-width: 420px;
  }

  .photo-single img {
    border-radius: 10px;
    object-fit: cover;
  }

  .photo-single figcaption {
    font-size: 0.78rem;
    color: var(--ink-sub);
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  footer {
    padding: 40px 0 56px;
    text-align: left;
    font-size: 0.8rem;
    color: var(--ink-sub);
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <button type="button" id="menuToggle" class="menu-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
      <span class="site-title">Sunny English Circle</span>
    </div>
  </header>

  <nav id="siteNav" class="site-nav">
    <ul>
      <li><a class="nav-link" href="index.html">ホーム</a></li>
      <li><a class="nav-link" href="about.html">サークルについて</a></li>
      <li><a class="nav-link" href="schedule.html" aria-current="page">開催エリア・会場</a></li>
      <li><a class="nav-link" href="join.html">参加費・お申し込み</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-header">
      <div class="section-inner">
        <h1>開催エリア・会場／開催日時</h1>
      </div>
    </div>

    <section class="page-section" id="area">
      <div class="section-inner">
        <span class="eyebrow">Area</span>
        <h2>開催エリア・会場</h2>
        <div class="section-body">
          <div class="info-row">
            <span class="label">開催エリア</span>
            <p class="value">溝の口・高津・中原・武蔵新城（川崎市）</p>
          </div>
          <div class="info-row">
            <span class="label">会場</span>
            <p class="value">Parklet Cafe ほか</p>
            <!-- 差し替え: 会場の詳しい住所は未確定のため掲載しない。確定後も原則「各回でご案内します」の運用を継続するか要相談 -->
            <p class="note">会場の詳しい住所は各回でご案内します。</p>
          </div>
        </div>

        <figure class="photo-single">
          <img src="images/exterior.jpg" width="1108" height="1477" alt="サークル会場Parklet Cafeの外観とマスコットのぬいぐるみ" loading="lazy">
        </figure>
      </div>
    </section>

    <section class="page-section section-alt" id="schedule">
      <div class="section-inner">
        <span class="eyebrow">Schedule</span>
        <h2>開催日時</h2>
        <div class="section-body">
          <!-- 差し替え: 開催日時（曜日・時間・所要時間）が確定次第、具体的な情報に差し替える -->
          <p>開催日は回ごとにご案内しています。</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="section-inner">
      <p>Sunny English Circle</p>
    </div>
  </footer>

  <script>
    (function () {
      var toggle = document.getElementById('menuToggle');
      var nav = document.getElementById('siteNav');

      function openMenu() {
        nav.classList.add('is-open');
        toggle.setAttribute('aria-expanded', 'true');
        toggle.setAttribute('aria-label', 'メニューを閉じる');
      }

      function closeMenu() {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'メニューを開く');
      }

      toggle.addEventListener('click', function () {
        if (nav.classList.contains('is-open')) {
          closeMenu();
        } else {
          openMenu();
        }
      });

      var navLinks = nav.querySelectorAll('.nav-link');
      for (var i = 0; i < navLinks.length; i++) {
        navLinks[i].addEventListener('click', function () {
          closeMenu();
        });
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') {
          closeMenu();
        }
      });
    })();
  </script>

</body>
</html>
